<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#03060b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>PELAGIC / Living ASCII Worlds</title>
<style>
:root { color-scheme: dark; --bg:#03060b; --line:#1e293b; --ink:#b9c6d8; --muted:#667487; --accent:#8ccfea; }
* { box-sizing:border-box; }
html,body { width:100%; height:100%; margin:0; padding:0; overflow:hidden; background:var(--bg); }
body { font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,"Liberation Mono",monospace; -webkit-font-smoothing:antialiased; }
.app { display:grid; grid-template-rows:minmax(0,3fr) 37px minmax(0,1fr); height:100vh; height:100dvh; width:100%; background:var(--bg); overflow:hidden; }
.art { width:100%; position:relative; min-height:0; overflow:hidden; background:#03060b; }
.art canvas { display:block; width:100%; height:100%; touch-action:manipulation; }
.art:after { content:""; position:absolute; inset:0; pointer-events:none; background:radial-gradient(ellipse 75% 85% at 50% 46%,transparent 40%,rgba(1,3,8,.34) 100%); }
.hud { position:absolute; z-index:2; color:rgba(156,178,202,.45); font-size:10px; letter-spacing:.13em; line-height:1.8; pointer-events:none; text-transform:uppercase; }
.hud.top-left { top:17px; left:20px; }
.hud.top-right { top:17px; right:20px; text-align:right; }
.hud.bottom-left { bottom:15px; left:20px; }
.hud.bottom-right { bottom:15px; right:20px; text-align:right; }
.hud strong { color:rgba(187,222,236,.75); font-weight:500; }
.bar { border-top:1px solid #292929; border-bottom:1px solid #292929; display:flex; align-items:stretch; justify-content:space-between; gap:6px; padding:0 12px 0 16px; background:#000; min-width:0; }
.identity { display:flex; gap:10px; align-items:center; min-width:0; white-space:nowrap; color:#b6c6d8; font-size:11px; font-weight:650; letter-spacing:.10em; }
.identity em { color:#64738a; font-style:normal; font-size:10px; font-weight:400; }
.led { width:5px; height:5px; display:block; border-radius:50%; background:#fff; box-shadow:none; flex:none; }
.led.off { background:#777; box-shadow:none; }
.actions { display:flex; align-items:center; gap:1px; flex:none; }
.scene-switch {flex:none; border:1px solid #fff;background:#fff;color:#000;font:600 10px/1 "Courier New",monospace;letter-spacing:.055em;padding:7px 10px;white-space:nowrap;cursor:pointer;min-width:78px;}
.scene-switch:hover,.scene-switch:focus-visible{color:#000;background:#ddd;}
@media(max-width:480px){.bar .identity{display:none}.scene-switch{padding:6px 7px;font-size:9px;min-width:76px}.bar .actions button{min-width:32px;padding:0 5px}}
@media(max-width:355px){.scene-switch{min-width:68px;font-size:8px}.bar .actions button{min-width:29px;padding:0 4px}}
.actions button { -webkit-tap-highlight-color:transparent; display:inline-flex; align-items:center; justify-content:center; gap:7px; background:#000; border:0; color:#eee; height:35px; min-width:42px; padding:0 9px; font:500 10px/1 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; letter-spacing:.05em; cursor:pointer; border-left:1px solid rgba(123,145,169,.10); border-radius:0; }
.actions button:hover { color:#000; background:#eaeaea; }
.actions button:focus-visible { outline:2px solid #fff; outline-offset:-3px; }
.swatch { width:10px; height:10px; flex:none; display:inline-block; border-radius:50%; background:linear-gradient(125deg,#fff,#777)!important; border:1px solid #dedede; box-shadow:none; }
.code { position:relative; min-height:0; overflow:hidden; background:#000; }
.code:after { content:""; position:absolute; pointer-events:none; inset:0; background:linear-gradient(to bottom,rgba(0,0,0,.16),transparent 14%,transparent 86%,rgba(0,0,0,.18)); }
.code-inner { will-change:transform; font-family:"Courier New",Courier,monospace; font-variant-ligatures:none; font-weight:400; text-shadow:none; transition:transform 130ms linear; }
.line { display:flex; white-space:pre; align-items:baseline; height:15px; line-height:15px; font-size:9px; font-weight:400; color:#ededed; letter-spacing:0; }
.ln { display:inline-block; flex:0 0 35px; text-align:right; padding-right:12px; color:#777; opacity:1; user-select:none; font-size:inherit; line-height:inherit; }
.src { color:inherit; white-space:pre; font-size:inherit; line-height:inherit; font-weight:inherit; }
@media(max-width:480px){ .app{grid-template-rows:minmax(0,3fr) 35px minmax(0,1fr)}.hud{font-size:9px}.hud.top-left{top:14px;left:13px}.hud.top-right{top:14px;right:13px}.hud.bottom-left{left:13px;bottom:10px}.hud.bottom-right{right:13px;bottom:10px}.bar{padding:0 6px 0 11px}.identity{font-size:10px;gap:7px}.identity em{display:none}.actions button{height:33px;min-width:36px;padding:0 7px;font-size:10px}.line{font-size:9px;line-height:15px;height:15px}.ln{flex-basis:31px;padding-right:8px} }
@media(max-width:340px){.hud.bottom-right{display:none}.identity{letter-spacing:0}.actions button{padding:0 5px;min-width:32px}.actions button .word{display:none}}

/* DEV replaces the live code and never covers the artwork. */
.dev-panel[hidden]{display:none!important}
.code.dev-active .code-inner{display:none}
.dev-panel{position:relative;z-index:3;width:100%;height:100%;overflow:hidden;min-height:0;padding:7px 12px 5px;background:#06110f;color:#b4d7c8;font:10px/1.15 "Courier New",Courier,monospace;display:flex;flex-direction:column;gap:5px}
.dev-panel header{display:flex;align-items:center;gap:7px;flex:0 0 auto;min-height:23px}
.dev-panel h2{font:700 11px/1 "Courier New",monospace;letter-spacing:.08em;color:#c1f0d3;margin:0;white-space:nowrap}
.dev-panel .dev-mode{font-size:9px;color:#588b77;white-space:nowrap}
.dev-panel .preset-group{margin-left:auto;display:flex;gap:5px;align-items:center;min-width:0}
.dev-panel .preset-group label{color:#83b6a0;font-size:9px}
.dev-panel .effect-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:3px 13px;grid-template-rows:repeat(4,minmax(0,1fr));flex:1 1 auto;min-height:0;align-content:stretch}
.dev-panel .effect{min-width:0;min-height:0;border-top:1px solid #1b3530;padding:4px 0 0;display:flex;flex-direction:column;gap:2px}
.dev-panel .effect-title{display:flex;align-items:center;justify-content:space-between;gap:2px;min-width:0}
.dev-panel .effect-title label{display:flex;align-items:center;gap:5px;min-width:0;white-space:nowrap}
.dev-panel .effect-title label span{overflow:hidden;text-overflow:ellipsis}
.dev-panel input[type=checkbox]{accent-color:#76cfaa;width:12px;height:12px;flex:none;margin:0}
.dev-panel input[type=range]{display:block;width:100%;margin:0;accent-color:#85caa7;height:15px;min-width:0;cursor:pointer}
.dev-panel input[type=range]:disabled{opacity:.27}
.dev-panel output{font-variant-numeric:tabular-nums;white-space:nowrap;font-size:9px;color:#ade3bf}
.dev-panel button,.dev-panel select{border:1px solid #35574c;border-radius:2px;background:#0d261e;color:#c1e8dc;font:10px/1 "Courier New",monospace;padding:4px 6px;cursor:pointer}
.dev-panel select{max-width:94px}
.dev-panel button:focus-visible,.dev-panel select:focus-visible{outline:2px solid #9be2c2;outline-offset:1px}
.dev-panel .dev-footer{display:flex;align-items:center;gap:5px;flex:0 0 auto;min-height:22px}
.dev-panel .dev-footer button{white-space:nowrap;padding:4px 6px}
.dev-panel .readout{color:#82b09e;font-size:9px;margin-left:auto;min-width:0;text-align:right;white-space:nowrap}
@media(max-width:480px){.dev-panel{padding:5px 7px 3px;gap:3px;font-size:9px}.dev-panel header{min-height:21px}.dev-panel h2{font-size:10px}.dev-panel .dev-mode{display:none}.dev-panel .effect-grid{gap:2px 9px}.dev-panel .effect{padding-top:3px}.dev-panel input[type=range]{height:14px}.dev-panel .dev-footer button{font-size:9px;padding:4px 5px}.dev-panel .readout{font-size:8px}.actions button#devToggle{min-width:34px}}
@media(max-height:650px){.dev-panel{gap:2px;padding-top:3px;padding-bottom:2px}.dev-panel header{min-height:18px}.dev-panel .effect{padding-top:1px}.dev-panel input[type=range]{height:12px}.dev-panel .dev-footer{min-height:18px}}
 .actions button[aria-pressed="true"] { color:#000; background:#fff; }
.app.installation { grid-template-rows:minmax(0,1fr); }
.app.installation > .bar,.app.installation > .code,.app.installation .hud { display:none; }
.exit-installation { display:none; position:absolute; z-index:7; top:12px; right:12px; padding:6px 9px; border:1px solid #354350; border-radius:3px; background:rgba(4,10,17,.64); color:#adbdcc; font:10px "Courier New",monospace; cursor:pointer; opacity:.30; }
.exit-installation:focus-visible,.exit-installation:hover {opacity:1;}
.app.installation .exit-installation {display:block;}



/* Independent LIFE/WEATHER developer tabs occupy the existing lower panel. */
.dev-tabs{display:flex;gap:3px;align-items:center;flex:0 0 auto}
.dev-tabs button{font-size:9px;padding:4px 5px;background:transparent;border:1px solid #24453d;color:#8cb6a6}
.dev-tabs button[aria-pressed="true"]{color:#d5f4e4;background:#214b3b}
.dev-panel .effect-grid[hidden],.eco-panel[hidden]{display:none!important}
.dev-panel.life-mode .preset-group{display:none}
.eco-panel{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;gap:5px;color:#9ec8b8}
.eco-summary{font-size:9px;white-space:normal;flex:none;line-height:1.2}
.eco-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));grid-template-rows:repeat(2,1fr);flex:1;gap:3px 10px;min-height:0}
.eco-switch{display:flex;align-items:center;gap:6px;padding:3px 0 2px;border-top:1px solid #1b3530;font-size:10px;cursor:pointer}
.eco-switch input{accent-color:#76cfaa;margin:0;flex:none;width:13px;height:13px}
.eco-tools{display:flex;gap:7px;align-items:center;min-height:19px;flex:none;font-size:9px}
.eco-tools label{display:flex;align-items:center;gap:7px;flex:1}
.eco-tools input{width:100%;flex:1;min-width:0;accent-color:#79d6a5}
.eco-tools button{padding:4px 6px;min-width:42px}
.eco-tools small{margin-left:auto;white-space:nowrap;color:#658c7b;font-size:8px}
@media(max-width:480px){.dev-tabs button{font-size:8px;padding:3px}.dev-panel h2{font-size:9px}.eco-summary{font-size:8px}.eco-panel{gap:3px}.eco-switch{font-size:9px;padding:1px 0}.eco-tools button{font-size:9px;min-width:35px;padding:3px 5px}.eco-tools small{display:none}}
@media(max-height:650px){.eco-summary{display:none}.eco-panel{gap:2px}.eco-tools{min-height:16px}}
@media(prefers-reduced-motion:reduce){.led{box-shadow:none}}

/* Executed-stage trace: highlight a moving line in the actual source listing. */
.code .line.active-code{background:#383838;color:#fff;box-shadow:inset 3px 0 #a0a0a0}
.code .line.active-code .ln{color:#d0d0d0}
.live-indicator{display:inline-block;width:6px;height:6px;border-radius:50%;background:#39ed70;vertical-align:middle;box-shadow:0 0 9px rgba(65,255,113,.48);animation:liveBlink 1.5s ease-in-out infinite}
.live-indicator.off{background:#999;box-shadow:none;animation:none}
@keyframes liveBlink{0%,100%{opacity:1}50%{opacity:.18}}
@media(prefers-reduced-motion:reduce){.live-indicator{animation:none}}
/* Weather source and location controls live inside the existing DEV panel. */
.dev-panel{overflow-y:auto;overscroll-behavior:contain;scrollbar-width:thin}
.dev-panel .effect-grid{flex:0 0 auto;grid-template-rows:repeat(4,32px)}
.dev-panel .effect{padding-top:2px}
.weather-source[hidden]{display:none!important}
.weather-source{display:flex;flex-direction:column;gap:3px;flex:none;border-bottom:1px solid #2c4038;padding-bottom:4px}
.weather-source .source-row{display:flex;align-items:center;gap:4px;min-height:20px}
.weather-source button{font-size:9px;border-color:#666;background:#000;color:#ddd}
.weather-source button[aria-pressed="true"]{background:#fff;color:#000;border-color:#fff}
.weather-source .source-status{color:#a6c8b6;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font:9px/1.2 'Courier New',monospace;flex:1}
.weather-source .location-entry{flex:1;min-width:0;background:#050807;border:1px solid #4b6359;border-radius:2px;padding:2px 4px;font:10px 'Courier New',monospace;color:#ddd;height:20px}
.weather-source .location-label{font-size:8px;color:#8bada1;white-space:nowrap;text-overflow:ellipsis;overflow:hidden}
.weather-source .location-meta{color:#85a398;font-size:9px;white-space:nowrap}
.dev-panel .preset-group select:disabled{opacity:.4}
@media(max-width:480px){.weather-source .source-row{min-height:18px}.weather-source .source-status{font-size:8px}.weather-source button{padding:3px 5px}.dev-panel .effect-grid{grid-template-rows:repeat(4,30px)}}
</style>
</head>
<body>
<main class="app" aria-label="Procedural ASCII art experiment">
  <section class="art" id="art" aria-label="Animated ASCII jellyfish with bioluminescent tentacles and moving ASCII sea life">
    <canvas id="sea" role="img" aria-label="Colourful animated ASCII jellyfish in a dark deep-sea scene"></canvas>
    <div class="hud top-left">PELAGIC <strong>/</strong> 013<br>LIVING ECOSYSTEM</div>
    <div class="hud top-right"><span id="status">LIVE</span> <span id="liveDot" class="live-indicator" aria-label="Animation running"></span></div>
    <div class="hud bottom-left">MEDUSA <strong>ASTRALIS</strong></div>
    <div class="hud bottom-right">DEPTH <strong>2480 M</strong><br>PROCEDURAL MOTION</div>

    <button type="button" class="exit-installation" id="exitInstallation" aria-label="Exit installation mode">EXIT</button>

  </section>
  <nav class="bar" aria-label="Animation controls">
    <div class="identity"><span id="led" class="led"></span><span>medusa.js</span><em>/ live source</em></div>
    <button id="sceneToggle" class="scene-switch" type="button" aria-label="Switch between PELAGIC jellyfish and GREENWOOD forest" title="Switch between living ASCII scenes"><span id="sceneName">◌ PELAGIC</span></button>
    <div class="actions">
      <button id="color" type="button" aria-label="Change colour palette" title="Change colour palette"><i id="swatch" class="swatch"></i><span class="word" id="colorName">LUMEN</span></button>
      <button id="density" type="button" aria-label="Toggle ASCII detail" title="Toggle ASCII detail"><span id="densityName">HI-RES</span></button>
      <button id="speed" type="button" aria-label="Change animation speed" title="Change animation speed"><span id="speedName">1×</span></button>
      <button id="devToggle" type="button" aria-label="Open developer simulation" aria-expanded="false" aria-controls="devPanel" title="Environmental simulator"><span>DEV</span></button>
      <button id="pause" type="button" aria-label="Pause animation" title="Pause animation"><span id="pauseName">Ⅱ</span></button>
    </div>
  </nav>
  <section class="code" id="code" aria-label="Continuously scrolling generative animation source code">
    <div class="code-inner" id="codeInner" aria-hidden="true"></div>
    <aside class="dev-panel" id="devPanel" hidden aria-label="Environmental simulation developer controls">
      <header><h2>DEV / CONTROL</h2><div class="dev-tabs"><button id="devTabWeather" type="button" aria-pressed="true">WEATHER</button><button id="devTabLife" type="button" aria-pressed="false">LIFE</button></div><span class="dev-mode" id="weatherModeBadge">LIVE WEATHER</span><div class="preset-group"><label for="weatherPreset">PRESET</label><select id="weatherPreset" aria-label="Weather preset"><option value="custom">Custom</option><option value="calm">Calm</option><option value="storm">Storm</option><option value="cold">Cold</option><option value="heat">Heatwave</option><option value="night">Night</option><option value="mist">Mist</option></select></div><button id="devClose" type="button" aria-label="Close developer panel">×</button></header>
      <div class="weather-source" id="weatherSource">
        <div class="source-row"><button id="weatherModeLive" type="button" aria-pressed="true">LIVE</button><button id="weatherModeTest" type="button" aria-pressed="false">TEST</button><span class="source-status" id="weatherStatus" aria-live="polite">Connecting…</span></div>
        <div class="source-row"><input class="location-entry" id="weatherCity" aria-label="Weather location" placeholder="Town or city" value="Lancaster"><button id="setWeatherCity" type="button">SET</button><button id="weatherUseGPS" type="button" aria-label="Use device location">GPS</button><button id="weatherRefresh" type="button" aria-label="Refresh live weather">↻</button></div>
        <div class="location-label" id="weatherLocationLabel">Lancaster, UK · Open-Meteo</div>
      </div>
      <div class="effect-grid" id="weatherControls"></div>
      <section class="eco-panel" id="ecosystemPanel" hidden aria-label="PELAGIC ecosystem controls">
        <div class="eco-summary">AUTOMATIC • Rare encounters are live. Use the buttons below for manual testing.</div>
        <div class="eco-grid" id="ecosystemControls"></div>
        <div class="eco-tools"><label>Activity <input id="ecoRate" aria-label="Ecosystem event frequency" type="range" min="0.55" max="2" step="0.05" value="1"></label><output id="ecoRateValue">1.00×</output></div>
        <div class="eco-tools eco-actions"><button type="button" data-spawn="bloom">BLOOM</button><button type="button" data-spawn="prey">PREY</button><button type="button" data-spawn="fish">FISH</button><button type="button" id="ecoReset">CLEAR</button><small>Simulated encounters</small></div>
      </section>
      <div class="dev-footer"><button type="button" id="simulatePresence">PRESENCE</button><button type="button" id="simulateTouch">TOUCH</button><button type="button" id="installationMode">FULL ART</button><span class="readout" id="devReadout">Z —</span></div>
    </aside>
  </section>
</main>
<script src="./environment.js"></script>
<script src="./greenwood.js"></script>
<script src="./ecosystem.js"></script>
<script>
(()=>{'use strict';
  const canvas=document.getElementById('sea');
  const ctx=canvas.getContext('2d',{alpha:false});
  const art=document.getElementById('art');
  const codeInner=document.getElementById('codeInner');
  const codeBox=document.getElementById('code');
  // Environmental values are computed in environment.js and do not own the animal.
  const environment=window.PelagicEnvironment;
  const greenwood=window.PelagicGreenwood;
  const ecosystem=window.PelagicEcosystem;
  if(!ecosystem)throw Error('PELAGIC ecosystem module missing');
  if(!greenwood)throw Error('GREENWOOD scene module missing');
  let currentScene='pelagic';try{const requested=new URLSearchParams(location.search).get('scene');currentScene=requested==='greenwood'?'greenwood':requested==='pelagic'?'pelagic':localStorage.getItem('pelagic.scene')==='greenwood'?'greenwood':'pelagic';}catch(_){}
  if(!environment)throw Error('Environment adapter missing');
  let environmentalFx=environment.effects();
  const PI=Math.PI,TAU=PI*2;
  const rand=(n)=>{let x=Math.sin(n*127.1+78.23)*43758.5453;return x-Math.floor(x)};
  const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
  const swimmer={x:0,y:0,vx:0,vy:0,angle:0,yaw:.18,pitch:-.07,
    strokePhase:0,stroke:0,pulse:0,pulseRate:0,thrust:0,travel:0,turn:0,initialised:false,
    z:.20,vz:0,energy:.7,curiousUntil:0,startledUntil:0,interest:0,startle:0,behaviour:'exploring',
    burstUntil:0,burstPower:0,nextBurstAt:8,streamline:0,
    depthGoal:.20,nextDepthDecision:15,depthChanges:0,
    ceilingGlide:false,glideDirection:1,glideStart:0 };
  // Smooth, seeded random motion: no teleporting targets, no repeating L/R loop.
  const noise=(time,seed)=>{
    const cell=Math.floor(time),f=time-cell;
    const u=f*f*f*(f*(f*6-15)+10);
    return 2*(rand(cell*11.71+seed)*(1-u)+rand((cell+1)*11.71+seed)*u)-1;
  };
  const bodyScale=()=>clamp(Math.exp(-swimmer.z*.50),.47,1.87);
  // Independent wildlife and feeding logic live in ecosystem.js.
  const wake=[];
  const ropes=[];
  let ropeDebt=0;
  let bellHull=null;
  const shortest=(a)=>Math.atan2(Math.sin(a),Math.cos(a));
  const ease=(a,b,rate,dt)=>a+(b-a)*(1-Math.exp(-rate*dt));

  const palettes=[
    {name:'LUMEN',start:172,span:233,sat:92,swatch:'linear-gradient(125deg,#65e4ed,#cb65d6,#fac96e)'},
    {name:'AURORA',start:147,span:122,sat:85,swatch:'linear-gradient(125deg,#aaffbc,#2d87d5)'},
    {name:'CORAL',start:284,span:149,sat:92,swatch:'linear-gradient(125deg,#f7d28f,#df61c2)'},
    {name:'GHOST',start:183,span:54,sat:32,swatch:'linear-gradient(125deg,#eefaff,#7995b4)'},
  ];
  let paletteIndex=0,highRes=true,speed=1,paused=false;
  let width=390,height=570,dpr=1,t=0,last=0,drawDebt=0,sourceOffset=0,sourceHeight=1;
  let sourceLines=0,traceIndex=0,traceTimer=0,traceLast=-1;
  let traceRanges={},traceSeen=new Set(),traceStage='physics',traceStageOffset=0,traceStageIndex=0;
  const stars=Array.from({length:175},(_,i)=>({x:rand(i*7+1),y:rand(i*7+2),v:.3+rand(i*7+3)*1.0,s:rand(i*7+4),phase:rand(i*7+5)*TAU}));
  const plankton=Array.from({length:45},(_,i)=>({x:rand(i*13+7),y:rand(i*13+8),phase:rand(i*13+9)*TAU,drift:rand(i*13+10)*2+1}));
  let font=10,letter=6,row=11,centerX=195,centerY=215,radius=150;
  const setFont=(px)=>{ctx.font=`${px}px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace`;ctx.textBaseline='middle';};
  // The base palette is spectral. A slow phase drift animates the
  // chromatic bands without making the entire animal flash in unison.
  const temperatureStops=[[-10,[21,70,181]],[-5,[34,102,220]],[0,[78,171,247]],
    [5,[88,222,235]],[10,[247,166,67]],[15,[251,104,55]],
    [20,[243,66,61]],[25,[212,25,51]],[35,[187,20,47]]];
  let temperatureTint={value:NaN,r:0,g:0,b:0};
  function getTemperatureTint(){
    const degrees=clamp(12+environmentalFx.temperature*30,-10,35);
    if(!Number.isFinite(temperatureTint.value)||Math.abs(degrees-temperatureTint.value)>.025){
      let j=1;
      while(j<temperatureStops.length-1 && degrees>temperatureStops[j][0])j++;

    return {outline,minX:Math.min(...outline.map(p=>p.x)),maxX:Math.max(...outline.map(p=>p.x)),
      minY:Math.min(...outline.map(p=>p.y)),maxY:Math.max(...outline.map(p=>p.y))};
  }
  // Return the closest outward edge normal when a particle is within
  // the solid silhouette. Hull vertices are counter-clockwise.
  function bellPenetration(x,y,hull=bellHull){
    if(!hull||x<hull.minX||x>hull.maxX||y<hull.minY||y>hull.maxY)return null;
    let min=Infinity,nx=0,ny=0;
    const edge=hull.outline;
    for(let i=0;i<edge.length;i++){
      const a=edge[i],b=edge[(i+1)%edge.length];
      const dx=b.x-a.x,dy=b.y-a.y,dist=Math.hypot(dx,dy)||1;
      const signed=(dx*(y-a.y)-dy*(x-a.x))/dist;
      if(signed<0)return null;
      if(signed<min){min=signed;nx=dy/dist;ny=-dx/dist;}
    }
    return {depth:min,nx,ny};
  }
  function pushOutsideBell(pt,hull,padding){
    const hit=bellPenetration(pt.x,pt.y,hull);
    if(!hit)return;
    const correction=hit.depth+padding;
    pt.x+=hit.nx*correction;
    pt.y+=hit.ny*correction;
    // Remove velocity into the surface. Otherwise the rope can visibly
    // vibrate as the next Verlet step tries to tunnel back through it.
    const vx=pt.x-pt.px,vy=pt.y-pt.py;
    const inward=vx*hit.nx+vy*hit.ny;
    if(inward<0){pt.px+=vx*.18-hit.nx*inward;pt.py+=vy*.18-hit.ny*inward;}
  }
  // Each strand is a small, independent Verlet chain: no rigid sinusoidal
  // tentacle mesh. Flow and body motion introduce drag, slack and lag.
  function configureRopes(){
    ropes.length=0;
    const add=(kind,index,count,phi,length)=>{
      const n=Math.max(15,Math.ceil(length/(font*.85)));
      ropes.push({kind,index,phi,length,n,step:length/n,
        seed:rand(130+index*13+(kind==='oral'?50:kind==='front'?100:0))*TAU,
        points:null});
    };
    for(let i=0;i<19;i++){
      const phi=TAU*(i+.28)/19;
      add('back',i,19,phi,radius*(1.45+rand(301+i)*.65));
    }
    for(let i=0;i<7;i++){
      const phi=TAU*(i+.38)/7;
      add('front',i,7,phi,radius*(1.35+rand(401+i)*.72));
    }
    for(let i=0;i<5;i++)add('oral',i,5,0,radius*(1.27+rand(501+i)*.63));
    ropeDebt=0;
  }
  function ropeAnchor(r,time){
    if(r.kind==='oral'){
      const roots=[-.29,-.13,0,.13,.29];
      // Oral arms spring from the underside, not the top of the bell.
      return project(radius*roots[r.index]*(1-.09*swimmer.pulse),radius*.235,radius*.12);
    }
    const rim=bellSurface(PI*.5,r.phi,time);
    return project(rim.x*1.012,rim.y+radius*.026,rim.z*1.012);
  }
  function advanceRopes(dt,time){
    const a=swimmer;
    bellHull=makeBellHull(time);
    for(const r of ropes){
      const anchor=ropeAnchor(r,time);
      const tailX=Math.sin(a.angle),tailY=Math.cos(a.angle);
      if(!r.points){
        r.points=Array.from({length:r.n+1},(_,i)=>{
          const u=i/r.n, d=u*r.length;
          const x=anchor.x+tailX*d*bodyScale()+Math.sin(u*7+r.seed)*u*radius*.13*bodyScale();
          const y=anchor.y+tailY*d*bodyScale()+Math.cos(u*6+r.seed)*u*radius*.10*bodyScale();
          return {x,y,px:x,py:y};
        });
      }
      const p=r.points;
      if(!dt){p[0].x=anchor.x;p[0].y=anchor.y;continue;}
      for(let i=1;i<p.length;i++){
        const u=i/r.n,pt=p[i];
        const dx=(pt.x-pt.px)*.952,dy=(pt.y-pt.py)*.952;
        pt.px=pt.x;pt.py=pt.y;
        // Travelling current varies along each arm; drag pulls against the
        // moving bell. A soft tailward bias prevents implausible tangling.
        const wave=time*1.15-u*6+r.seed;
        const flowX=69*Math.sin(wave)+40*Math.sin(time*.52+u*9+r.seed*1.3)+environmentalFx.windX*.72;
        const flowY=51*Math.cos(wave*.83)+38*Math.sin(time*.77-u*8+r.seed)+environmentalFx.windY*.60;
        const pull=36+24*u;
        pt.x+=dx+(flowX*u+tailX*pull-a.vx*.22)*dt*dt;
        pt.y+=dy+(flowY*u+tailY*pull-a.vy*.22)*dt*dt;
      }
      // Maximum-distance constraints keep the soft ropes attached while
      // allowing them to fold, flutter and curl rather than standing straight.
      for(let iteration=0;iteration<4;iteration++){
        p[0].x=anchor.x;p[0].y=anchor.y;
        for(let i=1;i<p.length;i++){
          const prev=p[i-1],cur=p[i],dx=cur.x-prev.x,dy=cur.y-prev.y;
          const dist=Math.hypot(dx,dy)||.001;
          // Near the root, preserve a little minimum separation to avoid
          // physically impossible collapse into the umbrella.
          const actualStep=r.step*bodyScale();
          const undershoot=i<=5&&dist<actualStep*.52;
          if(dist>actualStep||undershoot){
            const target=undershoot?actualStep*.52:actualStep;
            const stretch=(dist-target)/dist;
            if(i===1){cur.x-=dx*stretch;cur.y-=dy*stretch;}
            else {const half=.5*stretch;
              cur.x-=dx*half;cur.y-=dy*half;
              prev.x+=dx*half;prev.y+=dy*half;}
          }
        }
        for(let i=1;i<p.length;i++)pushOutsideBell(p[i],bellHull,font*.35);
      }
      p[0].x=anchor.x;p[0].y=anchor.y;
    }
  }
  function drawRope(r,time){
    const p=r.points;if(!p)return;
    const back=r.kind==='back',oral=r.kind==='oral';
    const bright=oral?.75:back?.30:.64;
    const chars=oral?'%xVY@&i|/\\{}':'|/\\!i:;,.~';
    for(let i=1;i<p.length;i++){
      const a=p[i-1],b=p[i];
      const dx=b.x-a.x,dy=b.y-a.y,seg=Math.hypot(dx,dy)||1;
      const steps=Math.max(1,Math.ceil(seg/(font*.68)));
      const nx=-dy/seg,ny=dx/seg;
      for(let k=0;k<steps;k++){
        const q=k/steps,u=(i-1+q)/r.n;
        const x=a.x+dx*q,y=a.y+dy*q;
        const glyph=chars[Math.floor(rand(i*31+k*17+r.index*61+(oral?97:0))*chars.length)];
        const opacity=bright*Math.pow(1-u,.24)*(.87+.13*Math.sin(time*1.2-u*9+r.seed));
        const light=oral?78:back?66:73;
        const chroma=clamp(.48+.29*Math.sin(time*.45-u*5+r.seed*.36)
          +.17*Math.sin(time*.28+u*9+r.index*.7),0,1);
        if(!bellPenetration(x,y))print(glyph,x,y,colour(chroma,light,opacity),font,oral&&i%11===0?1.5:0);
        if(oral){
          const frill=(1-u*.57)*radius*bodyScale()*(.046+.027*Math.sin(time*1.8-u*14+r.seed));
          if(!bellPenetration(x+nx*frill,y+ny*frill))print(i%3===0?'{':'(',x+nx*frill,y+ny*frill,colour(clamp(chroma+.08*Math.sin(u*12+time*.7),0,1),73,opacity*.72));
          if(!bellPenetration(x-nx*frill,y-ny*frill))print(i%3===1?'}':')',x-nx*frill,y-ny*frill,colour(clamp(chroma+.12*Math.cos(u*10-time*.5),0,1),75,opacity*.65));
          if(k===0&&i%3===0){
            if(!bellPenetration(x+nx*frill*.45,y+ny*frill*.45))print('x',x+nx*frill*.45,y+ny*frill*.45,colour(chroma,78,opacity*.55));
          }
        }else if(!back&&k===0&&i%3===0){
          if(!bellPenetration(x+nx*font*.65,y+ny*font*.65))print('~',x+nx*font*.65,y+ny*font*.65,colour(chroma,70,opacity*.43));
        }
      }
    }
  }
  function drawMotes(time){

  function updateCodeTrace(delta){

    const available=(currentScene==='greenwood'?['forest']:['physics','ropes','ecosystem','render','weather'])
      .filter(key=>traceSeen.has(key)&&traceRanges[key]);
    if(!available.length)return;
    if(!available.includes(traceStage)||traceStageOffset>(traceRanges[traceStage].end-traceRanges[traceStage].start)){
      traceStageIndex=(traceStageIndex+1)%available.length;
      traceStage=available[traceStageIndex];traceStageOffset=0;
    }
    const area=traceRanges[traceStage];

    traceLast=traceIndex;

  document.getElementById('devClose').addEventListener('click',()=>toggleDeveloper(false));
  document.getElementById('weatherPreset').addEventListener('change',e=>{
    environment.preset(e.target.value);syncDeveloperControls();
  });
  function toggleInstallation(install){
    const was=app.classList.contains('installation');
    app.classList.toggle('installation',!!install);
    if(install)toggleDeveloper(false);
    if(was!==!!install){resize();buildSource();swim(0,t);advanceRopes(0,t);render(t);}
  }
  document.getElementById('installationMode').addEventListener('click',()=>toggleInstallation(true));
  document.getElementById('exitInstallation').addEventListener('click',()=>toggleInstallation(false));
  document.getElementById('simulatePresence').addEventListener('click',()=>signalPresence(1));
  document.getElementById('simulateTouch').addEventListener('click',()=>signalTouch(swimmer.x+radius*.3,swimmer.y+radius*.13));
  canvas.addEventListener('pointerdown',e=>{
    const bounds=canvas.getBoundingClientRect();
    signalTouch(e.clientX-bounds.left,e.clientY-bounds.top);
  });
  // A stable integration seam for future presence, touch and smart-home input.
  // The website never gains control over devices or stores credentials.
  window.PELAGIC=Object.freeze({
    environment: Object.freeze({setInput:environment.setInput,setEnabled:environment.setEnabled,preset:environment.preset}),
    ecosystem: Object.freeze({setEnabled:ecosystem.setEnabled,setRate:ecosystem.setRate,spawn:ecosystem.spawn,state:ecosystem.state}),
    presence: strength=>signalPresence(strength),
    touch: (x,y)=>signalTouch(x,y),
    debug: ()=>({x:swimmer.x,y:swimmer.y,z:swimmer.z,depthGoal:swimmer.depthGoal,depthChanges:swimmer.depthChanges,angle:swimmer.angle,scale:bodyScale(),velocity:[swimmer.vx,swimmer.vy,swimmer.vz],thrust:swimmer.thrust,ceilingGlide:swimmer.ceilingGlide,streamline:swimmer.streamline,burstActive:t<swimmer.burstUntil,ecosystem:ecosystem.state(),behaviour:swimmer.behaviour,effects:environmentalFx,penetrations:ropes.reduce((count,r)=>count+(r.points||[]).slice(1).filter(p=>!!bellPenetration(p.x,p.y)).length,0),ropeCount:ropes.length})
  });
  buildDeveloperControls();
  let weatherStatusTimer=0;
  function frame(now){
    if(!last)last=now;
    const delta=Math.min((now-last)/1000,.075);last=now;
    if(!paused){
      t+=delta*speed;
      markExecuted('weather');environment.tick(delta);
      weatherStatusTimer+=delta;
      if(weatherStatusTimer>3){weatherStatusTimer=0;if(!devPanel.hidden && !devPanel.classList.contains('life-mode')){syncDeveloperControls();}}
      environmentalFx=environment.effects();
      if(currentScene==='pelagic'){markExecuted('physics');swim(delta*speed,t);}
      ropeDebt+=delta*speed;
      let steps=0;
      while(ropeDebt>=1/60&&steps++<5){if(currentScene==='pelagic'){markExecuted('ropes');advanceRopes(1/60,t-ropeDebt+1/60);}ropeDebt-=1/60;}
      if(steps>5)ropeDebt=0;
      if(currentScene==='pelagic'){markExecuted('ecosystem');ecosystem.update(delta*speed,t,swimmer,ropes,{width,height,radius,scale:bodyScale()},environmentalFx);}
      updateCodeTrace(delta);
      drawDebt+=delta;
      if(drawDebt>=1/30){markExecuted(currentScene==='greenwood'?'forest':'render');render(t);drawDebt=0;
        if(!devPanel.hidden)document.getElementById('devReadout').textContent=currentScene==='greenwood'?`GROVE · ${greenwood.season}`:devPanel.classList.contains('life-mode')?`CATCH ${ecosystem.state().counts.preyCaught}`:`Z ${swimmer.z.toFixed(1)} · ${swimmer.behaviour.slice(0,5).toUpperCase()}`;
      }
    }
    requestAnimationFrame(frame);
  }
  document.getElementById('sceneToggle').addEventListener('click',()=>switchScene());
  document.getElementById('color').addEventListener('click',changePalette);
  document.getElementById('density').addEventListener('click',toggleDetail);
  document.getElementById('speed').addEventListener('click',changeSpeed);
  document.getElementById('pause').addEventListener('click',togglePause);
  document.addEventListener('keydown',e=>{if(e.code==='Space'&&!['BUTTON','INPUT'].includes(document.activeElement.tagName)){e.preventDefault();togglePause();}if(e.key==='c')changePalette();if(e.key==='d')toggleDetail();if(e.key==='`')toggleDeveloper();if(e.key==='Escape'){toggleDeveloper(false);if(app.classList.contains('installation'))toggleInstallation(false);}});
  let resizePending=0;
  window.addEventListener('resize',()=>{cancelAnimationFrame(resizePending);resizePending=requestAnimationFrame(()=>{resize();buildSource();swim(0,t);advanceRopes(0,t);render(t);});},{passive:true});
  resize();swim(0,0);advanceRopes(0,0);switchScene(currentScene);
  if(matchMedia('(prefers-reduced-motion:reduce)').matches)togglePause();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
