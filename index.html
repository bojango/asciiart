<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#03060b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>PELAGIC / Living ASCII</title>
<style>
:root { color-scheme: dark; --bg:#03060b; --line:#1e293b; --ink:#b9c6d8; --muted:#667487; --accent:#8ccfea; }
* { box-sizing:border-box; }
html,body { width:100%; height:100%; margin:0; padding:0; overflow:hidden; background:var(--bg); }
body { font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,"Liberation Mono",monospace; -webkit-font-smoothing:antialiased; }
.app { display:grid; grid-template-rows:minmax(0,2fr) 37px minmax(0,1fr); height:100vh; height:100dvh; width:100%; background:var(--bg); overflow:hidden; }
.art { width:100%; position:relative; min-height:0; overflow:hidden; background:#03060b; }
.art canvas { display:block; width:100%; height:100%; touch-action:manipulation; }
.art:after { content:""; position:absolute; inset:0; pointer-events:none; background:radial-gradient(ellipse 75% 85% at 50% 46%,transparent 40%,rgba(1,3,8,.34) 100%); }
.hud { position:absolute; z-index:2; color:rgba(156,178,202,.45); font-size:10px; letter-spacing:.13em; line-height:1.8; pointer-events:none; text-transform:uppercase; }
.hud.top-left { top:17px; left:20px; }
.hud.top-right { top:17px; right:20px; text-align:right; }
.hud.bottom-left { bottom:15px; left:20px; }
.hud.bottom-right { bottom:15px; right:20px; text-align:right; }
.hud strong { color:rgba(187,222,236,.75); font-weight:500; }
.bar { border-top:1px solid #2a3547; border-bottom:1px solid #263248; display:flex; align-items:stretch; justify-content:space-between; gap:6px; padding:0 12px 0 16px; background:#0a101b; min-width:0; }
.identity { display:flex; gap:10px; align-items:center; min-width:0; white-space:nowrap; color:#b6c6d8; font-size:11px; font-weight:650; letter-spacing:.10em; }
.identity em { color:#64738a; font-style:normal; font-size:10px; font-weight:400; }
.led { width:5px; height:5px; display:block; border-radius:50%; background:#74d7be; box-shadow:0 0 9px rgba(99,242,186,.55); flex:none; }
.led.off { background:#8b7385; box-shadow:none; }
.actions { display:flex; align-items:center; gap:1px; flex:none; }
.actions button { -webkit-tap-highlight-color:transparent; display:inline-flex; align-items:center; justify-content:center; gap:7px; background:none; border:0; color:#a4b6ca; height:35px; min-width:42px; padding:0 9px; font:500 10px/1 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; letter-spacing:.05em; cursor:pointer; border-left:1px solid rgba(123,145,169,.10); border-radius:0; }
.actions button:hover { color:#e2f5ff; background:#132137; }
.actions button:focus-visible { outline:2px solid #8bc8ea; outline-offset:-3px; }
.swatch { width:10px; height:10px; flex:none; display:inline-block; border-radius:50%; background:linear-gradient(125deg,#b7faff,#7075ee); box-shadow:0 0 8px rgba(111,150,252,.35); }
.code { position:relative; min-height:0; overflow:hidden; background:#050d0a; }
.code:after { content:""; position:absolute; pointer-events:none; inset:0; background:repeating-linear-gradient(to bottom,transparent 0,transparent 3px,rgba(79,175,129,.018) 4px),linear-gradient(to bottom,rgba(5,13,10,.3),transparent 15%,transparent 87%,rgba(5,13,10,.3)); }
.code-inner { will-change:transform; font-family:"Courier New",Courier,monospace; font-variant-ligatures:none; font-weight:400; text-shadow:0 0 5px rgba(102,219,152,.09); }
.line { display:flex; white-space:pre; align-items:baseline; height:15px; line-height:15px; font-size:9px; font-weight:400; color:#9bd6ac; letter-spacing:0; }
.ln { display:inline-block; flex:0 0 35px; text-align:right; padding-right:12px; color:inherit; opacity:.43; user-select:none; font-size:inherit; line-height:inherit; }
.src { color:inherit; white-space:pre; font-size:inherit; line-height:inherit; font-weight:inherit; }
@media(max-width:480px){ .app{grid-template-rows:minmax(0,2fr) 35px minmax(0,1fr)}.hud{font-size:9px}.hud.top-left{top:14px;left:13px}.hud.top-right{top:14px;right:13px}.hud.bottom-left{left:13px;bottom:10px}.hud.bottom-right{right:13px;bottom:10px}.bar{padding:0 6px 0 11px}.identity{font-size:10px;gap:7px}.identity em{display:none}.actions button{height:33px;min-width:36px;padding:0 7px;font-size:10px}.line{font-size:9px;line-height:15px;height:15px}.ln{flex-basis:31px;padding-right:8px} }
@media(max-width:340px){.hud.bottom-right{display:none}.identity{letter-spacing:0}.actions button{padding:0 5px;min-width:32px}.actions button .word{display:none}}
@media(prefers-reduced-motion:reduce){.led{box-shadow:none}}
</style>
</head>
<body>
<main class="app" aria-label="Procedural ASCII art experiment">
  <section class="art" id="art" aria-label="Animated ASCII jellyfish with bioluminescent tentacles and moving ASCII sea life">
    <canvas id="sea" role="img" aria-label="Colourful animated ASCII jellyfish in a dark deep-sea scene"></canvas>
    <div class="hud top-left">PELAGIC <strong>/</strong> 005<br>GENERATIVE SPECIMEN</div>
    <div class="hud top-right"><span id="status">LIVE</span> <strong>●</strong><br><span id="detailStat">192 × 92</span></div>
    <div class="hud bottom-left">MEDUSA <strong>ASTRALIS</strong><br>ALL GLYPHS / NO IMAGES</div>
    <div class="hud bottom-right">DEPTH <strong>2480 M</strong><br>PROCEDURAL MOTION</div>
  </section>
  <nav class="bar" aria-label="Animation controls">
    <div class="identity"><span id="led" class="led"></span><span>medusa.js</span><em>/ live source</em></div>
    <div class="actions">
      <button id="color" type="button" aria-label="Change colour palette" title="Change colour palette"><i id="swatch" class="swatch"></i><span class="word" id="colorName">ABYSS</span></button>
      <button id="density" type="button" aria-label="Toggle ASCII detail" title="Toggle ASCII detail"><span id="densityName">HI-RES</span></button>
      <button id="speed" type="button" aria-label="Change animation speed" title="Change animation speed"><span id="speedName">1×</span></button>
      <button id="pause" type="button" aria-label="Pause animation" title="Pause animation"><span id="pauseName">Ⅱ</span></button>
    </div>
  </nav>
  <section class="code" id="code" aria-label="Continuously scrolling generative animation source code">
    <div class="code-inner" id="codeInner" aria-hidden="true"></div>
  </section>
</main>
<script>
(()=>{'use strict';
  const canvas=document.getElementById('sea');
  const ctx=canvas.getContext('2d',{alpha:false});
  const art=document.getElementById('art');
  const codeInner=document.getElementById('codeInner');
  const codeBox=document.getElementById('code');
  const PI=Math.PI,TAU=PI*2;
  const rand=(n)=>{let x=Math.sin(n*127.1+78.23)*43758.5453;return x-Math.floor(x)};
  const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
  const swimmer={x:0,y:0,vx:0,vy:0,angle:-.12,yaw:.18,pitch:-.07,
    strokePhase:0,stroke:0,travel:0,turn:0,initialised:false};
  // Smooth, seeded random motion: no teleporting targets, no repeating L/R loop.
  const noise=(time,seed)=>{
    const cell=Math.floor(time),f=time-cell;
    const u=f*f*f*(f*(f*6-15)+10);
    return 2*(rand(cell*11.71+seed)*(1-u)+rand((cell+1)*11.71+seed)*u)-1;
  };
  const ropes=[];
  let ropeDebt=0;
  const shortest=(a)=>Math.atan2(Math.sin(a),Math.cos(a));
  const ease=(a,b,rate,dt)=>a+(b-a)*(1-Math.exp(-rate*dt));

  const palettes=[
    {name:'ABYSS',top:190,base:256,edge:275,sat:88,swatch:'linear-gradient(125deg,#b7faff,#7075ee)'},
    {name:'AURORA',top:153,base:203,edge:248,sat:82,swatch:'linear-gradient(125deg,#aaffbc,#2d87d5)'},
    {name:'CORAL',top:38,base:330,edge:290,sat:88,swatch:'linear-gradient(125deg,#f7d28f,#df61c2)'},
    {name:'GHOST',top:194,base:221,edge:244,sat:31,swatch:'linear-gradient(125deg,#eefaff,#7995b4)'},
  ];
  let paletteIndex=0,highRes=true,speed=1,paused=false;
  let width=390,height=570,dpr=1,t=0,last=0,drawDebt=0,sourceOffset=0,sourceHeight=1;
  const stars=Array.from({length:175},(_,i)=>({x:rand(i*7+1),y:rand(i*7+2),v:.3+rand(i*7+3)*1.0,s:rand(i*7+4),phase:rand(i*7+5)*TAU}));
  const plankton=Array.from({length:45},(_,i)=>({x:rand(i*13+7),y:rand(i*13+8),phase:rand(i*13+9)*TAU,drift:rand(i*13+10)*2+1}));
  let font=10,letter=6,row=11,centerX=195,centerY=215,radius=150;
  const setFont=(px)=>{ctx.font=`${px}px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace`;ctx.textBaseline='middle';};
  const colour=(progress,light,opacity=1)=>{
    const p=palettes[paletteIndex];
    let hue=progress<.55?p.top+(p.base-p.top)*(progress/.55):p.base+(p.edge-p.base)*((progress-.55)/.45);
    return `hsla(${((hue%360)+360)%360},${p.sat}%,${light}%,${clamp(opacity,0,1)})`;
  };
  function resize(){
    const b=art.getBoundingClientRect();width=Math.max(200,b.width);height=Math.max(230,b.height);
    dpr=Math.min(window.devicePixelRatio||1,width<500?1.5:2);
    canvas.width=Math.round(width*dpr);canvas.height=Math.round(height*dpr);
    ctx.setTransform(dpr,0,0,dpr,0,0);
    radius=Math.min(width*.258,height*.195,165);
    font=clamp(radius*(highRes?.060:.082),highRes?8.2:11,highRes?12.5:16);
    letter=font*.614;row=font*1.08;
    document.getElementById('detailStat').textContent=`${Math.round(width/letter)} × ${Math.round(height/row)}`;
    configureRopes();
  }
  const print=(char,x,y,color,px=font,glow=0)=>{
    if(x<-25||x>width+25||y<-25||y>height+25)return;
    if(px!==font)setFont(px);
    ctx.fillStyle=color;
    if(glow){ctx.shadowColor=color;ctx.shadowBlur=glow;}
    ctx.fillText(char,x,y);
    if(glow)ctx.shadowBlur=0;
    if(px!==font)setFont(font);
  };
  function drawBackground(time){
    ctx.fillStyle='#03060b';ctx.fillRect(0,0,width,height);
    const mist=ctx.createRadialGradient(centerX,centerY-radius*.25,10,centerX,centerY-radius*.25,Math.max(radius*2.4,height*.68));
    mist.addColorStop(0,colour(.26,24,.11));mist.addColorStop(.55,colour(.7,17,.047));mist.addColorStop(1,'rgba(0,0,0,0)');
    ctx.fillStyle=mist;ctx.fillRect(0,0,width,height);
    setFont(font);
    for(const s of stars){
      const x=s.x*width+Math.sin(time*.2+s.phase)*5;
      const y=(s.y*height+time*s.v*2.4)%(height+12);
      const strength=(.07+s.s*.22)*(.72+.28*Math.sin(time*.8+s.phase));
      const char=s.s>.975?'*':s.s>.90?'+':s.s>.70?':':'.';
      print(char,x,y,colour(.12+s.s*.62,72,strength),s.s>.92?font+1:font);
    }
    for(let i=0;i<plankton.length;i++){
      const p=plankton[i],x=p.x*width+Math.sin(time*.45+p.phase)*15;
      const y=((p.y*height-time*p.drift*3)%(height+25)+(height+25))%(height+25);
      const glow=.10+.13*(.5+.5*Math.sin(time*1.1+p.phase));
      print(i%9===0?'o':i%3===0?'+':'.',x,y,colour(.4+(i%5)*.10,75,glow));
    }
  }
  const miniForm=[
    '   .-~~-.   ',
    " .'  ::  '. ",
    '/  .----.  \\',
    '\\_.------._/',
    '  ) )  ( (  ',
    ' ( (    ) ) ',
    '  )      (  ',
  ];
  function drawMini(time,index){
    const locations=[[.13,.28,.70],[.86,.23,.84],[.13,.75,1.01],[.87,.75,.79]];
    const [px,py,scale]=locations[index];
    const shift=Math.sin(time*.24+index*2)*13;
    const top=height*py+Math.sin(time*.3+index)*8;
    const x=width*px+shift;
    const f=clamp(font*scale,7,11.2);
    const a=.19+(index%3)*.038;
    setFont(f);
    const step=f*.62;
    miniForm.forEach((line,j)=>{
      for(let i=0;i<line.length;i++){
        const ch=line[i];if(ch===' ')continue;
        const dx=j>3?(Math.sin(time*.9+j*.7+index)*Math.pow((j-3)/4,1.7)*5):0;
        print(ch,x+(i-6)*step+dx,top+j*f*1.05,colour(.2+index*.18,68,a*(1-j*.06)),f);
      }
    });
    setFont(font);
  }
  // The bell remains one consistent size: only its scalloped edge flexes.
  // Directional travel and 3D rotation are separate, gently coupled motions.
  function project(x,y,z){
    const a=swimmer, cy=Math.cos(a.yaw),sy=Math.sin(a.yaw);
    const xx=x*cy+z*sy, zz=z*cy-x*sy;
    const cp=Math.cos(a.pitch),sp=Math.sin(a.pitch);
    const yy=y*cp-zz*sp, depth=y*sp+zz*cp;
    const perspective=clamp(1+depth/(radius*9.0),.83,1.18);
    const px=xx*perspective,py=yy*perspective;
    const c=Math.cos(a.angle),si=Math.sin(a.angle);
    return {x:a.x+px*c-py*si,y:a.y+px*si+py*c,z:depth};
  }
  function swim(dt,time){
    const a=swimmer;
    if(!a.initialised){
      a.x=width*.48; a.y=height*.39;
      a.angle=-.13; a.initialised=true;
    }
    // A continuous current drives the whole body along smooth, irregular
    // arcs. Velocity has inertia, and close-to-edge steering is soft.
    const horizontal=clamp(width*(.50+.25*noise(time*.16,12)+.045*noise(time*.37,70)),radius*1.20,width-radius*1.20);
    const vertical=clamp(height*(.46+.20*noise(time*.135,51)+.045*noise(time*.31,86)),radius*1.25,height-radius*1.30);
    const desiredX=(horizontal-a.x)*1.12+27*noise(time*.43,5);
    const desiredY=(vertical-a.y)*1.05+31*noise(time*.36,93);
    let vx=desiredX,vy=desiredY;
    const magnitude=Math.hypot(vx,vy)||1;
    const limit=Math.min(width,height)*.22;
    if(magnitude>limit){vx*=limit/magnitude;vy*=limit/magnitude;}
    a.strokePhase+=dt*(4.8+.35*noise(time*.13,42));
    // Stroke gently changes speed, not size. This should feel like a glide,
    // rather than an inflating and deflating object.
    a.stroke=Math.pow(Math.max(0,Math.sin(a.strokePhase)),3);
    const thrust=1+.18*a.stroke;
    a.vx=ease(a.vx,vx*thrust,1.30,dt);
    a.vy=ease(a.vy,vy*thrust,1.30,dt);
    a.x+=a.vx*dt;a.y+=a.vy*dt;
    const minX=radius*1.10, maxX=width-radius*1.10;
    const minY=radius*1.10,maxY=height-radius*1.13;
    a.x=clamp(a.x,minX,maxX);
    a.y=clamp(a.y,minY,maxY);
    a.travel=Math.hypot(a.vx,a.vy);
    const aim=Math.atan2(a.vx,-a.vy);
    // Bank and turn with the flow, but never snap to a new heading.
    const relax=clamp(a.travel/35,.18,1);
    const change=shortest(aim-a.angle);
    a.angle+=clamp(change,-dt*.92*relax,dt*.92*relax);
    a.turn=ease(a.turn,change,1.1,dt);
    // Modest changes of viewpoint reveal the curved, translucent umbrella.
    a.yaw=ease(a.yaw,.68*noise(time*.20,8)+.21*Math.sin(time*.49),.90,dt);
    a.pitch=ease(a.pitch,.21*noise(time*.24,38)+.17*Math.sin(time*.43),.84,dt);
    centerX=a.x;centerY=a.y;
  }
  function drawBell(time){
    const R=radius, cells=new Map();
    const glyphs=['.',".,:'",':;!i',';!iI|','!iI|/\\','/\\tfjr','xvnuzXY','XYU0OQ','0Q8%#','8B%@#','$&@MW'];
    // A dimpled translucent dome, with ripples travelling across the edge.
    for(let j=0;j<29;j++){
      const polar=(j+.4)/29*PI*.5, ring=Math.sin(polar);
      const skirt=Math.pow(ring,4);
      for(let k=0;k<108;k++){
        const phi=TAU*k/108;
        const wave=.020*Math.sin(phi*8-time*1.8)+.018*Math.cos(phi*13+time*.71);
        const scallop=.021*Math.cos(phi*13-time*.9);
        const ripple=1+(scallop+wave)*skirt;
        const x=R*ring*Math.cos(phi)*ripple+R*ring*.014*Math.sin(time*.84+polar*9);
        const z=R*ring*Math.sin(phi)*.78*ripple;
        const y=R*(.125-1.0*Math.cos(polar)) + R*skirt*(.026*Math.sin(phi*8-time*1.6))+R*.009*Math.sin(time*1.25+phi*5+polar*8);
        const pos=project(x,y,z);
        const gx=Math.round((pos.x-swimmer.x)/letter);
        const gy=Math.round((pos.y-swimmer.y)/row);
        const key=gx+','+gy;
        const old=cells.get(key);
        if(old&&old.z>pos.z)continue;
        const ribs=Math.pow(Math.max(0,.5+.5*Math.cos(phi*15+time*.30)),7);
        const grain=Math.pow(Math.max(0,.5+.5*Math.cos(phi*41+polar*12-time*.28)),6);
        const crown=1-polar/(PI*.5);
        const near=.5+.5*Math.sin(phi+swimmer.yaw);
        const light=clamp(.29+.25*crown+.15*near+.20*ribs+.07*grain+
          .11*rand(k*61+j*123)+.04*Math.sin(time*.8+phi*9+polar*12),.06,.99);
        const band=glyphs[Math.min(glyphs.length-1,Math.floor(light*glyphs.length))];
        const ch=band[Math.floor(rand(k*43+j*73+17)*band.length)];
        cells.set(key,{x:swimmer.x+gx*letter,y:swimmer.y+gy*row,z:pos.z,
          ch,progress:.10+.64*(1-crown)+.15*(1-near),light:40+light*40,
          alpha:clamp(.22+.72*light,.15,.91)});
      }
    }
    setFont(font);
    for(const p of cells.values())print(p.ch,p.x,p.y,colour(p.progress,p.light,p.alpha));
    // Curled hem and fine ribs shift independently. No radial scaling pulse.
    for(let i=0;i<144;i++){
      const phi=TAU*i/144;
      const r=R*(1+.025*Math.cos(phi*13-time*.9));
      const y=R*(.125+.023*Math.sin(phi*8-time*1.6));
      const p=project(r*Math.cos(phi),y,.78*r*Math.sin(phi));
      const ch=i%13===0?'*':i%7===0?'~':i%5===0?'=':i%3===0?'_':'-';
      const near=.5+.5*Math.sin(phi+swimmer.yaw);
      print(ch,p.x,p.y,colour(.57+.25*near,75,.18+.53*near),font,i%19===0?2:0);
    }
    for(let rib=0;rib<15;rib++){
      const phi=TAU*rib/15;
      for(let j=3;j<22;j++){
        const polar=j/22*PI*.5;
        const x=R*Math.sin(polar)*Math.cos(phi)*.96;
        const z=R*Math.sin(polar)*Math.sin(phi)*.75;
        const y=R*(.125-Math.cos(polar));
        const p=project(x,y,z);
        print(':/\\|i'[j%5],p.x,p.y,colour(.14+polar/PI,70,.07+.18*Math.sin(polar)),font);
      }
    }
  }
  // Each strand is a small, independent Verlet chain: no rigid sinusoidal
  // tentacle mesh. Flow and body motion introduce drag, slack and lag.
  function configureRopes(){
    ropes.length=0;
    const add=(kind,index,count,phi,length)=>{
      const n=Math.max(15,Math.ceil(length/(font*.85)));
      ropes.push({kind,index,phi,length,n,step:length/n,
        seed:rand(130+index*13+(kind==='oral'?50:kind==='front'?100:0))*TAU,
        points:null});
    };
    for(let i=0;i<19;i++){
      const phi=TAU*(i+.28)/19;
      add('back',i,19,phi,radius*(1.45+rand(301+i)*.65));
    }
    for(let i=0;i<7;i++){
      const phi=TAU*(i+.38)/7;
      add('front',i,7,phi,radius*(1.35+rand(401+i)*.72));
    }
    for(let i=0;i<5;i++)add('oral',i,5,0,radius*(1.27+rand(501+i)*.63));
    ropeDebt=0;
  }
  function ropeAnchor(r,time){
    if(r.kind==='oral'){
      const roots=[-.29,-.13,0,.13,.29];
      return project(radius*roots[r.index],radius*.12,radius*.15);
    }
    const scallop=1+.02*Math.sin(r.phi*13-time*1.6);
    return project(radius*.90*scallop*Math.cos(r.phi),radius*.13,
      radius*.66*scallop*Math.sin(r.phi));
  }
  function advanceRopes(dt,time){
    const a=swimmer;
    for(const r of ropes){
      const anchor=ropeAnchor(r,time);
      const tailX=Math.sin(a.angle),tailY=Math.cos(a.angle);
      if(!r.points){
        r.points=Array.from({length:r.n+1},(_,i)=>{
          const u=i/r.n, d=u*r.length;
          const x=anchor.x+tailX*d+Math.sin(u*7+r.seed)*u*radius*.13;
          const y=anchor.y+tailY*d+Math.cos(u*6+r.seed)*u*radius*.10;
          return {x,y,px:x,py:y};
        });
      }
      const p=r.points;
      if(!dt){p[0].x=anchor.x;p[0].y=anchor.y;continue;}
      for(let i=1;i<p.length;i++){
        const u=i/r.n,pt=p[i];
        const dx=(pt.x-pt.px)*.945,dy=(pt.y-pt.py)*.945;
        pt.px=pt.x;pt.py=pt.y;
        // Travelling current varies along each arm; drag pulls against the
        // moving bell. A soft tailward bias prevents implausible tangling.
        const wave=time*1.15-u*6+r.seed;
        const flowX=85*Math.sin(wave)+46*Math.sin(time*.52+u*9+r.seed*1.3);
        const flowY=63*Math.cos(wave*.83)+41*Math.sin(time*.77-u*8+r.seed);
        const pull=25+25*u;
        pt.x+=dx+(flowX*u+tailX*pull-a.vx*.36)*dt*dt;
        pt.y+=dy+(flowY*u+tailY*pull-a.vy*.36)*dt*dt;
      }
      // Maximum-distance constraints keep the soft ropes attached while
      // allowing them to fold, flutter and curl rather than standing straight.
      for(let iteration=0;iteration<4;iteration++){
        p[0].x=anchor.x;p[0].y=anchor.y;
        for(let i=1;i<p.length;i++){
          const prev=p[i-1],cur=p[i],dx=cur.x-prev.x,dy=cur.y-prev.y;
          const dist=Math.hypot(dx,dy)||.001;
          if(dist<=r.step)continue;
          const stretch=(dist-r.step)/dist;
          if(i===1){cur.x-=dx*stretch;cur.y-=dy*stretch;}
          else {const half=.5*stretch;
            cur.x-=dx*half;cur.y-=dy*half;
            prev.x+=dx*half;prev.y+=dy*half;}
        }
      }
      p[0].x=anchor.x;p[0].y=anchor.y;
    }
  }
  function drawRope(r,time){
    const p=r.points;if(!p)return;
    const back=r.kind==='back',oral=r.kind==='oral';
    const bright=oral?.75:back?.30:.64;
    const chars=oral?'%xVY@&i|/\\{}':'|/\\!i:;,.~';
    for(let i=1;i<p.length;i++){
      const a=p[i-1],b=p[i];
      const dx=b.x-a.x,dy=b.y-a.y,seg=Math.hypot(dx,dy)||1;
      const steps=Math.max(1,Math.ceil(seg/(font*.68)));
      const nx=-dy/seg,ny=dx/seg;
      for(let k=0;k<steps;k++){
        const q=k/steps,u=(i-1+q)/r.n;
        const x=a.x+dx*q,y=a.y+dy*q;
        const glyph=chars[Math.floor(rand(i*31+k*17+r.index*61+(oral?97:0))*chars.length)];
        const opacity=bright*Math.pow(1-u,.24)*(.87+.13*Math.sin(time*1.2-u*9+r.seed));
        const light=oral?78:back?66:73;
        print(glyph,x,y,colour(.48+.43*u,light,opacity),font,oral&&i%11===0?1.5:0);
        if(oral){
          const frill=(1-u*.57)*radius*(.046+.027*Math.sin(time*1.8-u*14+r.seed));
          print(i%3===0?'{':'(',x+nx*frill,y+ny*frill,colour(.47+.43*u,73,opacity*.72));
          print(i%3===1?'}':')',x-nx*frill,y-ny*frill,colour(.60+.35*u,75,opacity*.65));
          if(k===0&&i%3===0){
            print('x',x+nx*frill*.45,y+ny*frill*.45,colour(.59+.28*u,78,opacity*.55));
          }
        }else if(!back&&k===0&&i%3===0){
          print('~',x+nx*font*.65,y+ny*font*.65,colour(.62+.31*u,70,opacity*.43));
        }
      }
    }
  }
  function drawMotes(time){
    for(let i=0;i<36;i++){
      const p=rand(i*3+1),a=time*(.42+.22*rand(i*9))+i*2.73;
      const x=Math.cos(a)*radius*(.30+p*1.25);
      const y=radius*.16+((i*.211+time*(.10+.028*p))%1)*radius*1.75;
      const z=Math.sin(a)*radius*.30;
      const pos=project(x,y,z);
      print(i%8===0?'+':i%5===0?'*':'.',pos.x,pos.y,
        colour(p,73,.12+.21*(1-p)),font);
    }
  }
  function render(time){
    centerX=swimmer.x;centerY=swimmer.y;
    drawBackground(time);
    for(let i=0;i<4;i++)drawMini(time,i);
    setFont(font);
    for(const rope of ropes)if(rope.kind==='back')drawRope(rope,time);
    drawBell(time);
    for(const rope of ropes)if(rope.kind==='oral')drawRope(rope,time);
    for(const rope of ropes)if(rope.kind==='front')drawRope(rope,time);
    drawMotes(time);
  }
  const escapeHTML=(s)=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  function buildSource(){
    // The panel displays real function bodies from the running animation engine.
    const chunks=[
      '// PELAGIC / live generative source',
      '// A free-swimming 3D jellyfish with trailing, independently moving arms.',
      'const PI = Math.PI, TAU = PI * 2;',
      '',
      noise.toString(),'',
      swim.toString(),'',
      project.toString(),'',
      colour.toString(),'',
      drawBell.toString(),'',
      configureRopes.toString(),'',
      advanceRopes.toString(),'',
      drawRope.toString(),'',
      drawBackground.toString(),'',
      drawMini.toString(),'',
      render.toString(),'',
      '// End of source. Return to the beginning.',
      ''
    ];
    const lines=chunks.join('\n').split('\n');
    const lineHeight=15;
    sourceHeight=lines.length*lineHeight;
    const once=lines.map((line,i)=>`<div class="line"><span class="ln">${String(i+1).padStart(3,'0')}</span><span class="src">${escapeHTML(line)||'&nbsp;'}</span></div>`).join('');
    codeInner.innerHTML=once+once;
  }
  function changePalette(){
    paletteIndex=(paletteIndex+1)%palettes.length;
    const p=palettes[paletteIndex];
    document.getElementById('colorName').textContent=p.name;
    document.getElementById('swatch').style.background=p.swatch;
  }
  function toggleDetail(){highRes=!highRes;document.getElementById('densityName').textContent=highRes?'HI-RES':'LO-RES';resize();}
  function changeSpeed(){speed=speed===1?1.5:speed===1.5?.65:1;document.getElementById('speedName').textContent=speed===.65?'0.65×':speed+'×';}
  function togglePause(){
    paused=!paused;
    document.getElementById('pauseName').textContent=paused?'▶':'Ⅱ';
    document.getElementById('pause').setAttribute('aria-label',paused?'Resume animation':'Pause animation');
    document.getElementById('led').classList.toggle('off',paused);
    document.getElementById('status').textContent=paused?'PAUSED':'LIVE';
  }
  function frame(now){
    if(!last)last=now;
    const delta=Math.min((now-last)/1000,.075);last=now;
    if(!paused){
      t+=delta*speed;
      swim(delta*speed,t);
      ropeDebt+=delta*speed;
      let steps=0;
      while(ropeDebt>=1/60&&steps++<5){advanceRopes(1/60,t-ropeDebt+1/60);ropeDebt-=1/60;}
      if(steps>5)ropeDebt=0;
      sourceOffset=(sourceOffset+delta*speed*31)%sourceHeight;
      codeInner.style.transform=`translate3d(0,${-sourceOffset}px,0)`;
      drawDebt+=delta;
      if(drawDebt>=1/30){render(t);drawDebt=0;}
    }
    requestAnimationFrame(frame);
  }
  document.getElementById('color').addEventListener('click',changePalette);
  document.getElementById('density').addEventListener('click',toggleDetail);
  document.getElementById('speed').addEventListener('click',changeSpeed);
  document.getElementById('pause').addEventListener('click',togglePause);
  document.addEventListener('keydown',e=>{if(e.code==='Space'&&!['BUTTON','INPUT'].includes(document.activeElement.tagName)){e.preventDefault();togglePause();}if(e.key==='c')changePalette();if(e.key==='d')toggleDetail();});
  let resizePending=0;
  window.addEventListener('resize',()=>{cancelAnimationFrame(resizePending);resizePending=requestAnimationFrame(()=>{resize();buildSource();swim(0,t);advanceRopes(0,t);render(t);});},{passive:true});
  resize();buildSource();swim(0,0);advanceRopes(0,0);render(0);
  if(matchMedia('(prefers-reduced-motion:reduce)').matches)togglePause();
  requestAnimationFrame(frame);
})();
</script>
