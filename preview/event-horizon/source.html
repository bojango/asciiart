<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#010102">
<title>EVENT HORIZON | Source RGB Light Review</title>
<style>
:root{color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#010102;color:#c4c0c4;font-family:'Courier New',monospace}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block;background:#010102}
.top{position:absolute;z-index:2;top:env(safe-area-inset-top,0px);left:0;right:0;padding:22px 20px;display:flex;justify-content:space-between;gap:12px;pointer-events:none;text-shadow:0 2px 8px #000}
.kicker{font-size:10px;letter-spacing:2.4px;color:#b1a7a3}
.meta{margin-top:7px;color:#777178;font-size:9px;line-height:1.6;letter-spacing:1.5px}
.note{font-size:9px;letter-spacing:1.4px;color:#c2a47a;text-align:right}
.controls{position:absolute;z-index:3;bottom:calc(env(safe-area-inset-bottom,0px) + 14px);left:12px;right:12px;padding:12px;border:1px solid #ffffff26;border-radius:14px;background:rgba(13,11,15,.88);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.buttons{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px}
.brightness-panel{padding:2px 4px 12px;margin-bottom:11px;border-bottom:1px solid #ffffff20}
.brightness-head{display:flex;align-items:center;gap:10px;margin-bottom:5px;color:#e0c8a8;letter-spacing:1px;font-size:10px}
.brightness-head label{flex:1}
.brightness-head output{color:#ffdc97;font-size:15px;font-weight:bold;letter-spacing:0;min-width:58px;text-align:right;font-variant-numeric:tabular-nums}
.brightness-panel input[type=range]{display:block;appearance:auto;width:100%;height:30px;margin:0;accent-color:#f5b65d;cursor:pointer;touch-action:pan-x}
.brightness-scale{display:flex;justify-content:space-between;gap:6px;color:#888087;font-size:9px;letter-spacing:.3px}
button#brightnessReset{min-height:27px;padding:3px 7px;font-size:9px}
button{appearance:none;-webkit-appearance:none;touch-action:manipulation;border:1px solid #ffffff28;border-radius:7px;background:#1a1719;color:#d5c7ba;min-height:37px;padding:8px 3px;font:10px 'Courier New',monospace;letter-spacing:.7px;cursor:pointer}
button.active{color:#fff1d1;border-color:#cf9a56;background:#3b281b}
button:disabled{opacity:.40;cursor:default}
.row{display:flex;justify-content:space-between;gap:10px;margin-top:11px;color:#969194;font-size:9px;letter-spacing:.4px}
.row strong{color:#e3c4a3;font-weight:400}
.footer{display:none;position:absolute;bottom:calc(env(safe-area-inset-bottom,0px) + 237px);left:0;right:0;text-align:center;color:#777078;font-size:9px;letter-spacing:1.3px;pointer-events:none}
@media(min-width:800px){.controls{left:50%;right:auto;transform:translateX(-50%);width:430px}.top{padding:30px 36px}}

/* Collapsible photometry lab: preserve as much of the artwork as possible. */
.tune-toggle{display:flex;width:100%;align-items:center;justify-content:space-between;
  border-color:#a97947;background:#302014;color:#ffe4ad;font-size:11px;letter-spacing:1.2px;text-align:left}
.tune-toggle span{color:#e6a952;font-size:10px}
.tuner-body[hidden],#settingsExport[hidden]{display:none}
.tuner-body{max-height:min(42vh,355px);max-height:min(42dvh,355px);overflow-y:auto;overscroll-behavior:contain;
  margin:8px 0 11px;padding:8px 7px 4px;background:#0e0b0f;border:1px solid #ffffff26;border-radius:9px;
  -webkit-overflow-scrolling:touch}
.tuner-intro{color:#958c8c;font-size:9px;line-height:1.5;margin-bottom:9px}
.tuner-item{padding:9px 0 12px;border-top:1px solid #ffffff17}
.tuner-item-head{display:flex;align-items:center;gap:10px;margin-bottom:4px}
.tuner-item label{flex:1;font-size:10px;letter-spacing:.9px;color:#e1c8a2}
.tuner-item output{font-size:13px;color:#ffdd9e;font-weight:bold;font-variant-numeric:tabular-nums;min-width:65px;text-align:right}
.tuner-item input[type=range]{display:block;width:100%;height:27px;margin:0;accent-color:#f5ae55;touch-action:pan-x}
.tuner-description{color:#8a8285;font-size:9px;margin-top:2px;line-height:1.3}
.tuner-actions{position:sticky;bottom:0;background:#0e0b0ff2;display:flex;gap:7px;
  padding:9px 0 5px;border-top:1px solid #ffffff25}
.tuner-actions button{flex:1;min-height:38px}
#copySettings{border-color:#c68f4f;color:#ffe5b0}
#copyStatus{color:#bea985;font-size:10px;min-height:14px;margin:5px 0}
#settingsExport{display:block;width:100%;min-height:90px;background:#1c171c;border:1px solid #777;
  color:#fff2dc;font:11px monospace;border-radius:6px;padding:8px;resize:vertical}
@media(max-height:700px){.tuner-body{max-height:34vh}}
</style>
</head>
<body>
<canvas id="art" aria-label="Experimental ASCII black hole with orbiting planets"></canvas>
<div class="top"><div><div class="kicker">EVENT HORIZON / SOURCE RGB</div><div class="meta">JIN2 LIGHTING PORT<br>SEPARATE VISUAL REVIEW</div></div><div class="note">NOT LIVE V2<br><span id="modeLabel">EXPERIMENT</span></div></div>
<div class="footer">PIXEL-RGB LUMINANCE · MULT/ MAX/ ADD · JIN2 REFERENCE</div>
<div class="controls">
<button id="tuneToggle" type="button" class="tune-toggle" aria-expanded="false" aria-controls="tunerBody">
  <strong>LIGHT STUDIO · 10 CONTROLS</strong><span id="tunerState">OPEN</span>
</button>
<div id="tunerBody" class="tuner-body" hidden>
  <div class="tuner-intro">Tune light, colour and glow independently. Numbers update as you drag. Collapse this panel to inspect the artwork.</div>
  <div id="tunerList"></div>
  <div class="tuner-actions">
    <button type="button" id="copySettings">COPY SETTINGS</button>
    <button type="button" id="resetSettings">RESET ALL</button>
  </div>
  <div id="copyStatus" role="status" aria-live="polite"></div>
  <textarea id="settingsExport" readonly hidden aria-label="Select these settings to copy manually"></textarea>
</div>
<div class="buttons">
<button id="engine" class="active">SOURCE / V2</button>
<button id="planet" class="active">PLANETS ON</button>
<button id="quality" class="active">DETAIL HI</button>
<button id="palette">EMBER</button>
<button id="speed">SPEED 1×</button>
<button id="pause">PAUSE</button>
</div>
<div class="row"><span>DISPLAY <strong id="dimensions">—</strong></span><span>ASCII <strong id="glyphs">—</strong></span><span>FPS <strong id="fps">—</strong></span></div>
</div>
<script src="../../event-horizon.js?v=20261119"></script>
<script>window.EventHorizonBaseline=window.PelagicEventHorizon;</script>
<script src="./source-compositor.js?v=4"></script>
<script src="./renderer-reference.js?v=1"></script>
<script>
(() => {
  'use strict';
  const port=window.EventHorizonRebuild,baseline=window.EventHorizonBaseline,photometry=window.EventHorizonSourceCompositor;
  if(!port||!baseline||!photometry){document.getElementById('modeLabel').textContent='SCRIPT ERROR';return}
  const canvas=document.getElementById('art'),ctx=canvas.getContext('2d',{alpha:false});
  const nodes=Object.fromEntries(['engine','planet','quality','palette','speed','pause',
    'tuneToggle','tunerState','tunerBody','tunerList','copySettings','resetSettings','copyStatus','settingsExport']
    .map(id=>[id,document.getElementById(id)]));
  let usePort=true,showPlanets=true,highDetail=true,playing=true,speed=1,elapsed=55,previous=0;
  let cssWidth=0,cssHeight=0,frames=0,frameWindow=0,fps=0;
  function resize(){
    const w=Math.max(280,innerWidth),h=Math.max(400,innerHeight),dpr=Math.min(devicePixelRatio||1,2);
    if(w===cssWidth&&h===cssHeight)return;
    cssWidth=w;cssHeight=h;canvas.width=Math.round(w*dpr);canvas.height=Math.round(h*dpr);
    canvas.style.width=w+'px';canvas.style.height=h+'px';
    ctx.setTransform(dpr,0,0,dpr,0,0);
    document.getElementById('dimensions').textContent=Math.round(w)+' × '+Math.round(h);
  }
  const tunerDefs=[
    {key:'brightness',label:'BRIGHTNESS',min:.25,max:16,step:.25,unit:'×',
      desc:'Overall black-hole RGB gain (can clip at high levels)'},
    {key:'coreExposure',label:'CORE EXPOSURE',min:.10,max:8,step:.05,unit:'×',
      desc:'Extra light for the hottest inner gas only'},
    {key:'warmth',label:'WARMTH / GOLD',min:0,max:3,step:.05,unit:'×',
      desc:'Shift the accretion gas toward orange and gold'},
    {key:'saturation',label:'SATURATION',min:0,max:2.5,step:.05,unit:'×',
      desc:'Preserve or intensify the gold instead of flat grey'},
    {key:'gamma',label:'GAMMA',min:.25,max:3,step:.05,unit:'',
      desc:'Raise or lower midtones without uniform RGB gain'},
    {key:'contrast',label:'CONTRAST',min:.25,max:4,step:.05,unit:'×',
      desc:'Separate dim gas from intense highlights'},
    {key:'highlightRolloff',label:'HIGHLIGHT ROLLOFF',min:0,max:1,step:.05,unit:'',
      desc:'Gradually compress clipping to retain white/gold detail'},
    {key:'bloomStrength',label:'BLOOM STRENGTH',min:0,max:4,step:.05,unit:'×',
      desc:'Light spilled from the crisp ASCII characters'},
    {key:'bloomRadiusSmall',label:'BLOOM RADIUS · NEAR',min:.25,max:6,step:.05,unit:'px',
      desc:'Tight, bright halo around each luminous glyph'},
    {key:'bloomRadiusWide',label:'BLOOM RADIUS · WIDE',min:.5,max:12,step:.05,unit:'px',
      desc:'Broad, diffuse accretion-disc glow'}
  ];
  const defaults=photometry.getDefaults();
  const sliders={};
  const outputs={};
  function format(key,v){
    const def=tunerDefs.find(x=>x.key===key);
    return Number(v).toFixed(2)+(def.unit||'');
  }
  for(const def of tunerDefs){
    const item=document.createElement('div');item.className='tuner-item';
    const head=document.createElement('div');head.className='tuner-item-head';
    const label=document.createElement('label');label.htmlFor='tuner-'+def.key;label.textContent=def.label;
    const output=document.createElement('output');output.id='output-'+def.key;output.htmlFor='tuner-'+def.key;
    const input=document.createElement('input');input.type='range';input.id='tuner-'+def.key;
    input.min=String(def.min);input.max=String(def.max);input.step=String(def.step);
    input.value=String(defaults[def.key]);input.setAttribute('aria-label',def.label);
    const desc=document.createElement('div');desc.className='tuner-description';desc.textContent=def.desc;
    head.append(label,output);item.append(head,input,desc);nodes.tunerList.appendChild(item);
    sliders[def.key]=input;outputs[def.key]=output;
    input.addEventListener('input',()=>updateParams({[def.key]:input.value},false));
    input.addEventListener('change',()=>saveSettings());
  }
  function displayParams(){
    const params=photometry.getParams();
    for(const def of tunerDefs){
      sliders[def.key].value=String(params[def.key]);
      outputs[def.key].textContent=format(def.key,params[def.key]);
    }
  }
  const settingsKey='eventHorizon.lightingTuners.v1';
  function updateParams(next,persist=false){
    photometry.setParams(next);
    displayParams();
    if(persist)saveSettings();
  }
  function saveSettings(){
    const values=photometry.getParams();
    try{localStorage.setItem(settingsKey,JSON.stringify(values))}catch(_){}
    try{
      const url=new URL(location.href);
      for(const [k,v] of Object.entries(values))url.searchParams.set(k,Number(v).toFixed(2));
      history.replaceState(null,'',url.toString());
    }catch(_){}
  }
  // URL values override saved values; support older brightness-only links.
  const initial={};
  try{
    const stored=JSON.parse(localStorage.getItem(settingsKey)||'null');
    if(stored&&typeof stored==='object')Object.assign(initial,stored);
    else{
      const remembered=localStorage.getItem('eventHorizon.previewBrightness');
      if(remembered!==null)initial.brightness=remembered;
    }
  }catch(_){}
  try{
    const search=new URLSearchParams(location.search);
    for(const def of tunerDefs){
      const supplied=search.get(def.key);
      if(supplied!==null)initial[def.key]=supplied;
    }
  }catch(_){}
  updateParams(initial);
  nodes.tuneToggle.onclick=()=>{
    const expanding=nodes.tunerBody.hidden;
    nodes.tunerBody.hidden=!expanding;
    nodes.tuneToggle.setAttribute('aria-expanded',String(expanding));
    nodes.tunerState.textContent=expanding?'CLOSE':'OPEN';
  };
  nodes.resetSettings.onclick=()=>{
    updateParams(defaults,true);
    nodes.copyStatus.textContent='All controls reset to original values.';
    nodes.settingsExport.hidden=true;
  };
  function exportPreset(){
    return JSON.stringify({
      scene:'EVENT HORIZON / SOURCE RGB',
      presetVersion:1,
      palette:port.palette,
      detail:highDetail?'HI':'LO',
      viewport:{width:Math.round(cssWidth),height:Math.round(cssHeight)},
      settings:photometry.getParams()
    },null,2);
  }
  nodes.copySettings.onclick=async()=>{
    saveSettings();
    const payload=exportPreset();
    try{
      if(!navigator.clipboard||!navigator.clipboard.writeText)throw Error('clipboard unsupported');
      await navigator.clipboard.writeText(payload);
      nodes.copyStatus.textContent='COPIED — paste the settings into ChatGPT.';
      nodes.settingsExport.hidden=true;
    }catch(_){
      nodes.settingsExport.hidden=false;
      nodes.settingsExport.value=payload;
      nodes.settingsExport.focus();
      nodes.settingsExport.select();
      nodes.copyStatus.textContent='Clipboard restricted: select and copy the JSON below.';
    }
  };
  nodes.engine.onclick=()=>{
    usePort=!usePort;
    nodes.engine.textContent=usePort?'SOURCE / V2':'V2 / SOURCE';
    nodes.engine.classList.toggle('active',usePort);
    nodes.planet.disabled=!usePort;
    for(const input of Object.values(sliders))input.disabled=!usePort;
    nodes.resetSettings.disabled=!usePort;
    nodes.copySettings.disabled=!usePort;
    document.getElementById('modeLabel').textContent=usePort?'SOURCE RGB':'RESTORED V2';
  };
  nodes.planet.onclick=()=>{showPlanets=!showPlanets;port.setShowPlanets(showPlanets);nodes.planet.textContent=showPlanets?'PLANETS ON':'BLACK HOLE';nodes.planet.classList.toggle('active',showPlanets)};
  nodes.quality.onclick=()=>{highDetail=!highDetail;nodes.quality.textContent=highDetail?'DETAIL HI':'DETAIL LO';nodes.quality.classList.toggle('active',highDetail)};
  nodes.pause.onclick=()=>{playing=!playing;nodes.pause.textContent=playing?'PAUSE':'PLAY';nodes.pause.classList.toggle('active',!playing)};
  nodes.speed.onclick=()=>{speed=speed===1?.25:speed===.25?2:1;nodes.speed.textContent='SPEED '+speed+'×'};
  nodes.palette.onclick=()=>{const name=(usePort?port:baseline).cyclePalette();nodes.palette.textContent=name};
  function frame(now){
    resize();
    const dt=previous?Math.min((now-previous)/1000,.05):0;previous=now;
    if(playing)elapsed+=dt*speed;
    const renderer=usePort?port:baseline;
    renderer.draw(ctx,cssWidth,cssHeight,elapsed,null,highDetail);
    if(now-frameWindow>700){
      fps=Math.round(frames*1000/Math.max(1,now-frameWindow));frames=0;frameWindow=now;
      document.getElementById('fps').textContent=fps;
      const stat=usePort?port.diagnostics():null;
      document.getElementById('glyphs').textContent=stat?stat.glyphs.toLocaleString():'V2';
    }
    frames++;
    requestAnimationFrame(frame);
  }
  addEventListener('resize',resize);
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
